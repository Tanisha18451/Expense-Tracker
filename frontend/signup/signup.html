<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Expense Tracker</title>
    <link rel="stylesheet" href="signup.css">
</head>

<body>
    <div class="signup-container">
        <h1>Expense Tracker</h1>
        <h2>Create Account</h2>
        <form id="signupForm">
            <label for="username">Username</label>
            <input type="text" id="username" required placeholder="Choose a username">

            <label for="email">Email</label>
            <input type="email" id="email" required placeholder="Enter your email">

            <label for="password">Password</label>
            <input type="password" id="password" required placeholder="Enter password">

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" required placeholder="Re-enter password">

            <button type="submit">Sign Up</button>
            <p class="login-text">Already have an account? <a href="../login/login.html">Login</a></p>
        </form>
    </div>

    <script src="signup.js"></script>
</body>

</html>
